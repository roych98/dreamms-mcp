[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dreamms-mcp"
version = "0.1.0"
description = "An MCP server for the DreamMS Stats API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "mcp>=2,<3",
    "textual>=1,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.8",
]

[project.scripts]
dreamms-mcp = "dreamms_mcp.server:main"
dreamms-setup = "dreamms_setup.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dreamms_mcp", "src/dreamms_setup"]
